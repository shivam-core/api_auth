services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ciphergate_user
      POSTGRES_PASSWORD: ciphergate_password_local_only
      POSTGRES_DB: ciphergate_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+psycopg://ciphergate_user:ciphergate_password_local_only@db:5432/ciphergate_db
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - JWT_PRIVATE_KEY_
      - JWT_PUBLIC_KEY_
      - NOTES_KEY_B64=CUZysJKNKvuOggqOWLLp9rmDwdJfBxUqHLv7iYp2fTw=
    depends_on:
      - db

volumes:
  pgdata:
